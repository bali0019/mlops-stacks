name: Debug Markdown Links Test
on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Specific test pattern to run'
        required: false
        default: 'tests/test_create_project.py::test_markdown_links[CICD_Only-no-no-no-gitlab-azure]'
        type: string

jobs:
  debug-markdown-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Python dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r dev-requirements.txt
            
      - name: Install Node.js dependencies
        run: |
            npm install -g markdown-link-check@3.10.3
            
      - name: Verify markdown-link-check installation
        run: |
            which markdown-link-check
            markdown-link-check --version
            npm list -g | grep markdown-link-check || echo "Not found in npm list"
            
      - name: Install act (for compatibility)
        run: |
          # Install act
          curl https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash
          echo "-P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest
          -P ubuntu-20.04=ghcr.io/catthehacker/ubuntu:act-20.04
          -P ubuntu-18.04=ghcr.io/catthehacker/ubuntu:act-18.04" > ~/.actrc
          echo "PATH=$PATH:$(pwd)/bin" >> "$GITHUB_ENV"
          
      - name: Generate CICD Zip (for compatibility)
        run: |
          cd template/{{.input_root_dir}}
          cp --parents .github/workflows/\{\{.input_project_name\}\}-* cicd/template
          cp --parents .azure/devops-pipelines/\{\{.input_project_name\}\}-* cicd/template
          tar -czvf cicd.tar.gz cicd
          rm -rf cicd/template/.github cicd/template/.azure
          cd ../..
          
      - name: Run specific markdown links test
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          pytest "${{ github.event.inputs.test_pattern }}" -vvv --tb=long --no-header -s
          
      - name: List generated files on failure
        if: failure()
        run: |
          echo "=== Looking for generated projects ==="
          find /tmp -name "*mlops*" -type d 2>/dev/null | head -10
          echo "=== Checking pytest temp directories ==="
          find /tmp -name "pytest-*" -type d 2>/dev/null | head -5
          echo "=== Looking for markdown files ==="
          find /tmp -name "*.md" 2>/dev/null | head -20