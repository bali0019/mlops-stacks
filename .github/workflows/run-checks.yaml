name: Run checks
on:
  pull_request:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install act
        run: |
          # Install act
          curl https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash
          echo "-P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest
          -P ubuntu-20.04=ghcr.io/catthehacker/ubuntu:act-20.04
          -P ubuntu-18.04=ghcr.io/catthehacker/ubuntu:act-18.04" > ~/.actrc
          echo "PATH=$PATH:$(pwd)/bin" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r dev-requirements.txt
      - name: Install Node.js dependencies
        run: |
            npm install -g markdown-link-check@3.10.3
      - name: Generate CICD Zip
        run: |
          cd template/{{.input_root_dir}}
          cp --parents .github/workflows/\{\{.input_project_name\}\}-* cicd/template
          cp --parents .azure/devops-pipelines/\{\{.input_project_name\}\}-* cicd/template
          tar -czvf cicd.tar.gz cicd
          rm -rf cicd/template/.github cicd/template/.azure
          cd ../..
      - name: Debug markdown-link-check installation
        run: |
          echo "=== Checking markdown-link-check installation ==="
          which markdown-link-check
          markdown-link-check --version
          npm list -g | grep markdown-link-check || echo "Not found in npm list"
      - name: Run ONLY specific markdown links test (TEMPORARY DEBUG)
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # Running only the failing test for quick debugging
          pytest 'tests/test_create_project.py::test_markdown_links[CICD_Only-no-no-no-gitlab-azure]' -vvv --tb=long -s
      - name: SKIP - Run all tests (temporarily disabled for debugging)
        if: false
        run: |
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          pytest tests --large -vv --black
